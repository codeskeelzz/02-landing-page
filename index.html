<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ember Coffee Shop</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <div class="nav__inner container">
            <h3>Ember</h3>

            <button aria-expanded="false" aria-label="Click to Open Menu" class="hamburger">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </button>

            <ul class="nav-links">
                <li><a href="/">Roast</a></li>
                <li><a href="/">Plans</a></li>
                <li><a href="/">How it Works</a></li>
                <li><a href="/">FAQs</a></li>
                <li class="subscribe"><a href="/">Subscribe</a></li>
            </ul>
        </div>   
    </nav>

    <main>
        <section class="hero">
            <div class="container">
                <div class="hero__content">   
                    <h2 class="hero__title">Fresh-roasted coffee, at your door.</h2>
                    <p class="hero__text">Small-batch beans roasted the week they ship. <br>Skip, pause or cancel anytime.
                    </p>

                    <div class="hero__cta">
                        <button class="color">Start your box</button>
                        <button class="nocolor">See roasts →</button>
                    </div>

                    <span class="star-review">★★★★★ 4.9 from 2,300+ happy drinkers</span>
                </div>

                <div class="hero__image">
                    <img src="./images/coffee-roastery.jpg" alt="Coffee Roastery">
                </div>
            </div>
        </section>

    </main>
    
    <script src="./script.js"></script>
</body>
</html>
